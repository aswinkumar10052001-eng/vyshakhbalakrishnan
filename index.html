<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f3ee" />
  <meta name="description" content="Vyshakh Balakrishnan — personal portfolio." />
  <title>Vyshakh Balakrishnan — Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style id="landing-fallback">
*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#151515;font-family:"DM Sans",sans-serif}
a{color:inherit;text-decoration:none}.hero{position:relative;min-height:100svh;isolation:isolate;overflow:hidden}
.photo-stage,.photo,.waves,.reveal-layer{position:absolute;inset:0;width:100%;height:100%}.photo{object-fit:cover}.photo-stage{z-index:0}.waves{fill:none;stroke:currentColor;stroke-width:1;opacity:.12;pointer-events:none}
.ui{position:absolute;inset:0;width:100%;height:100%}.ui--base{z-index:2}.ui--reveal{color:white}.reveal-layer{z-index:3;pointer-events:none}
.brand{font-family:"Playfair Display",Georgia,serif;font-size:clamp(40px,5.5vw,82px);line-height:1.06;letter-spacing:-.055em}.brand span{display:block}
.socials{position:absolute;right:5vw;bottom:32px;display:flex;gap:22px}.social{display:block;width:21px;height:21px}.social svg{display:block;width:100%;height:100%;fill:currentColor}
.cv-download{position:absolute;left:clamp(24px,5vw,88px);bottom:24px;z-index:4;display:inline-flex;align-items:center;gap:10px;padding:12px 17px;border:1px solid currentColor;border-radius:99px;font:600 9px/1.2 "DM Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;transition:background .25s,color .25s}
.cv-download:hover,.cv-download:focus-visible{background:#151515;color:#f5f3ee;outline-offset:4px}
.ui--reveal .cv-download:hover,.ui--reveal .cv-download:focus-visible{background:#f5f3ee;color:#151515}
</style>
<link rel="stylesheet" href="styles.css" />
<style id="intro-and-portfolio-enhancements">
/* Identical positioning in the base and masked interface keeps the reveal aligned. */
.hero{min-height:max(760px,100svh)}
.ui .intro-copy{position:absolute;left:clamp(24px,5vw,88px);top:clamp(40px,8vh,100px);width:min(500px,44vw);text-align:left}
.ui .intro-copy .brand{position:static;inset:auto;display:block;transform:none;width:auto;max-width:none;margin:0}
.intro-designations{margin:24px 0 0;max-width:480px;font-family:"DM Sans",sans-serif;font-size:12px;font-weight:500;line-height:1.85;letter-spacing:.025em}
.intro-location{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-family:"DM Sans",sans-serif;font-size:11px;line-height:1.6;letter-spacing:.08em}
.intro-location:before{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;flex:none}
.ui .portfolio-link{position:absolute;inset:clamp(36px,6vh,70px) clamp(24px,5vw,88px) auto auto;display:grid;grid-template-columns:auto 42px;align-items:center;gap:7px 16px;padding:10px 0 14px;font-family:"Playfair Display",Georgia,serif;font-size:clamp(24px,2.6vw,40px);line-height:1.2;letter-spacing:-.025em;transform:none;text-decoration:none}
.portfolio-arrow{display:grid;place-items:center;width:42px;height:42px;border:1px solid currentColor;border-radius:50%;font:24px/1 "DM Sans",sans-serif;transition:transform .45s cubic-bezier(.16,1,.3,1),background .3s,color .3s}
.portfolio-hint{grid-column:1/-1;font-family:"DM Sans",sans-serif;font-size:10px;line-height:1.6;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.portfolio-link:after{content:"";position:absolute;bottom:0;left:0;width:100%;height:1px;background:currentColor;transform:scaleX(.26);transform-origin:left;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.portfolio-link:hover:after,.portfolio-link:focus-visible:after{transform:scaleX(1)}
.portfolio-link:hover .portfolio-arrow,.portfolio-link:focus-visible .portfolio-arrow{transform:rotate(45deg);background:#151515;color:#f5f3ee}
.portfolio-link:focus-visible{outline:2px solid currentColor;outline-offset:8px}
.cv-actions{position:absolute;left:clamp(24px,5vw,88px);bottom:24px;z-index:4;display:flex;align-items:center;gap:10px}
.cv-actions .cv-action{position:static;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 17px;border:1px solid currentColor;border-radius:99px;font:600 9px/1.2 "DM Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;transition:background .25s,color .25s,transform .25s}
.cv-actions .cv-action:hover,.cv-actions .cv-action:focus-visible{background:#151515;color:#f5f3ee;outline-offset:4px;transform:translateY(-2px)}
.cv-actions .cv-view{background:rgba(245,243,238,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ui--reveal .cv-actions .cv-action:hover,.ui--reveal .cv-actions .cv-action:focus-visible{background:#f5f3ee;color:#151515}
@media(prefers-reduced-motion:no-preference){
.intro-copy{animation:intro-arrive .9s cubic-bezier(.16,1,.3,1) both}
.portfolio-label{animation:portfolio-invite 3s ease-in-out .8s 3}
@keyframes intro-arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes portfolio-invite{0%,100%{transform:translateY(0)}45%{transform:translateY(-4px)}65%{transform:translateY(0)}}
}
@media(max-width:760px){
.hero{min-height:960px;min-height:max(960px,100svh)}
.ui .intro-copy{display:none}
.ui .portfolio-link{top:24px;right:24px;font-size:25px;gap:5px 12px}
.portfolio-arrow{width:36px;height:36px;font-size:21px}.socials{bottom:30px;right:24px}
.cv-actions{left:24px;bottom:24px;gap:8px}.cv-actions .cv-action{padding:11px 13px;font-size:8px;letter-spacing:.1em}
}
@media(prefers-reduced-motion:reduce){.intro-copy,.portfolio-label{animation:none!important}.portfolio-link:after,.portfolio-arrow{transition:none!important}}
</style>
</head>

    <!-- Alternate colour portrait + a white copy of the interface, both masked by the same gooey blob. -->
